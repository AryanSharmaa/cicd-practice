
name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run Python application
        run: python app.py

      - name: Run automated tests
        run: python -m unittest test_app.py -v


      - name: Package application
        run: |
          mkdir -p dist
          zip -j dist/python-app.zip app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: dist/python-app.zip


  inspect-artifact:
    needs: run-python
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Inspect artifact
        run: unzip -l python-app.zip


  report:
    needs: run-python
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        run: echo "All Python checks passed!"

